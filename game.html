<!DOCTYPE html>
<html>
<head>
    <title>Math Mania - Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="home">

        <h1>MATH MANIA</h1>

        <h2>Calculation Challenge</h2>

        <h3 id="question"></h3>

        <p>Time Left: <span id="timer">10</span> seconds</p>

        <input type="number" id="answer" placeholder="Enter Answer">

        <br><br>

        <button onclick="checkAnswer()">Submit Answer</button>

        <p id="message"></p>

        <h3>Score: <span id="score">0</span></h3>

    </div>

    <script src="script.js"></script>

</body>
</html>
